<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Wishlist</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1effa;--card:#fff;--ink:#1e1b3b;--mute:#6b6890;--line:#e2dff3;--accent:#4b3fd1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14122b;--card:#1f1c3d;--ink:#f1effa;--mute:#9a97c4;--line:#33305c;--accent:#9d93ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{margin:0 0 4px;font-size:34px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px;font-size:15px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.price{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.note{margin:6px 0 0;color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.note a{color:var(--accent);font-weight:600}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mute)}
.foot{margin-top:22px;text-align:center;color:var(--mute);font-size:13px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.item{animation:up .35s ease both}
@media (prefers-reduced-motion:reduce){.item{animation:none}}
</style>
</head>
<body>
<h1>Wishlist</h1>
<p class="sub" id="sub">Loading...</p>
<div id="list"></div>
<p class="foot" id="foot"></p>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer nofollow">'+u+'</a>'})}
window.showMsg=function(m){document.getElementById('sub').textContent='';document.getElementById('list').innerHTML='<div class="msg">'+esc(m)+'</div>';document.getElementById('foot').textContent=''};
window.renderShare=function(d){
  var items=(d&&d.items)||[],total=0;
  items.forEach(function(w){total+=Number(w.p)||0});
  document.getElementById('sub').textContent=items.length?items.length+(items.length==1?' item':' items')+' · '+money(total)+' total':'';
  if(!items.length){document.getElementById('list').innerHTML='<div class="msg">Nothing on this wishlist right now.</div>';document.getElementById('foot').textContent='';return}
  document.getElementById('list').innerHTML=items.map(function(w,i){
    return '<div class="item" style="animation-delay:'+Math.min(i,10)*40+'ms"><div class="row"><span class="name">'+esc(w.n)+'</span><span class="price">'+money(w.p)+'</span></div>'+(w.t?'<p class="note">'+linkify(w.t)+'</p>':'')+'</div>';
  }).join('');
  document.getElementById('foot').textContent=d.updated?'Updated '+new Date(d.updated).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
};
</script>
<script type="module">
import {firebaseConfig} from './firebase-config.js';
const id=new URLSearchParams(location.search).get('id');
if(!id||!/^[a-z0-9]{10,64}$/.test(id)){window.showMsg('This link is not valid.')}
else{
  try{
    const V='10.12.2',G='https://www.gstatic.com/firebasejs/'+V+'/';
    const [S,F]=await Promise.all([import(G+'firebase-app.js'),import(G+'firebase-firestore.js')]);
    const app=S.initializeApp(firebaseConfig),db=F.getFirestore(app);
    F.onSnapshot(F.doc(db,'shared',id),function(s){
      if(!s.exists()){window.showMsg('This wishlist is not being shared anymore.');return}
      window.renderShare(s.data());
    },function(){window.showMsg('This wishlist could not be loaded. The link may have been turned off.')});
  }catch(e){window.showMsg('Could not load. Check your connection and try again.')}
}
</script>
</body>
</html>
